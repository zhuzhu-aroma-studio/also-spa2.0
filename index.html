<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ALSO SPA"><meta name="theme-color" content="#f7f3ed"><title>ALSO SPA 管理中心</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#35483d;background:#f7f3ed}*{box-sizing:border-box}body{margin:0}main{max-width:620px;margin:auto;padding:24px 18px 110px}.eyebrow{letter-spacing:.25em;font-size:11px;color:#9b897b}h1{font:normal 35px Georgia,serif;letter-spacing:.14em;margin:8px 0}h2{font-size:23px;margin:10px 0 18px}h3{font-size:17px}.muted{color:#8c8278;font-size:13px}.hero{padding:16px 0 24px;border-bottom:1px solid #e5ddd3}.panel,.tile{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 18px #45321d08}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{margin:0;min-height:115px;text-align:left;border:0;font:inherit;color:#35483d;cursor:pointer}.tile b{display:block;margin:16px 0 5px}.tile span{font-size:24px;color:#788f7b}button,select,input,textarea{font:inherit}button{cursor:pointer}.primary{width:100%;padding:14px;border:0;border-radius:12px;background:#718a76;color:white;font-weight:600;margin:8px 0}.outline{border:1px solid #d7cec3;background:white;color:#5c6f5e;border-radius:10px;padding:10px 13px}.danger{color:#a64b42}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row>*{min-width:0}label{display:block;font-size:13px;margin:12px 0 5px;font-weight:600}input,select,textarea{width:100%;padding:13px;border:1px solid #ddd7cd;border-radius:11px;background:white;color:#35483d}textarea{min-height:95px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffefaee;backdrop-filter:blur(14px);display:flex;justify-content:space-around;border-top:1px solid #e7e0d8;padding:10px 4px calc(10px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:#736a60;font-size:12px;padding:6px}.nav button.active{background:#e9ded4;border-radius:12px;color:#34483c}.back{background:none;border:0;color:#607866;padding:0;margin:20px 0 8px}.chip{display:inline-block;background:#efe4d9;padding:5px 9px;border-radius:9px;font-size:12px;color:#755e50}.item{border-bottom:1px solid #eee7e0;padding:12px 0}.item:last-child{border:0}.price{font-weight:700;color:#805d49}.small{font-size:12px}.hide{display:none}.pill{background:#e5e9e1;padding:7px 11px;border-radius:20px;font-size:12px} .num{font-size:29px;font-weight:700;color:#3d5848}.notice{background:#fff3d8;padding:13px;border-radius:12px;font-size:12px;color:#8a7045;margin:14px 0}img.cover{width:100%;border-radius:15px;margin:12px 0;display:block}details{border-bottom:1px solid #e8e0d8;padding:12px 0}summary{cursor:pointer;font-weight:600} .section{margin:20px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{flex:1}.badge{font-size:12px;background:#f0e8df;border-radius:8px;padding:4px 7px}</style></head><body><main id="app"><header class="hero"><div class="eyebrow">BODY · MIND · SOUL</div><h1>ALSO SPA</h1><div class="muted">內部營運管理中心</div></header><h2>工作管理中心</h2><div class="notice">若下方功能無法點擊，表示目前的檔案預覽器未執行 JavaScript。請將此檔案部署到 GitHub Pages，使用 Safari 開啟網址。</div><div class="grid"><div class="tile"><span>✧</span><b>每日業績</b></div><div class="tile"><span>✧</span><b>薪資計算</b></div><div class="tile"><span>✧</span><b>員工管理</b></div><div class="tile"><span>✧</span><b>SOP 知識庫</b></div></div></main><nav class="nav" id="nav"></nav><script>
'use strict';
const CATALOG=[
['經典芳療','芳香全身舒壓',70,2200,1699],['經典芳療','客製全身芳療',100,3200,2699],['經典芳療','孕期舒緩芳療',60,2200,1899],['經典芳療','孕期舒緩芳療',90,3000,2699],
['身體專項護理','滑罐深層循環',100,3500,2699],['身體專項護理','暖宮腹部護理',60,2000,1699],['身體專項護理','美胸循環護理',60,2000,1699],['身體專項護理','夏日美背護理',60,2000,1699],['身體專項護理','耳燭／頭・肩頸深層釋放＋晶體浴',60,2000,1699],

['VAGHEGGI 植萃臉部','矽晶淨化換膚',60,3200,2300],['VAGHEGGI 植萃臉部','淨白光蘊換膚',60,3200,2300],['VAGHEGGI 植萃臉部','水潤豐盈保濕',90,3500,2800],['VAGHEGGI 植萃臉部','奈米高氧注水（高壓氧儀器注水）',90,4500,3500],
['臉部加購','眼部緊緻抗衰',null,1000,1000],['臉部加購','頸部緊緻抗衰',null,1000,1000],['臉部加購','手工深層清潔',null,599,599],
['特色套裝','大地之母',120,4200,3298],['特色套裝','忘憂森林',120,4200,3298],['特色套裝','綠野仙蹤',120,4200,3298]
].map((x,i)=>({id:i+1,cat:x[0],name:x[1],minutes:x[2],original:x[3],member:x[4]}));
const SOP=[['銷售 SOP',['建立信任：詢問顧客需求與期待','需求分析：了解預算、時間、偏好與服務禁忌','課程介紹：清楚說明項目、時間、價格及適用情況','方案比較：介紹原價與會員價，不誇大效果','成交確認：取得顧客同意，核對服務與付款金額','售後追蹤：詢問感受、記錄回饋，尊重個人意願']],['顧客接待 SOP',['親切迎賓','確認服務需求與注意事項','引導入室與說明流程','結束後確認顧客感受']],['療程準備 SOP',['確認品項及耗材','清潔消毒工作區域','準備毛巾與設備','確認隱私及舒適度']],['環境清潔 SOP',['清潔接觸面','更換耗材與織品','設備檢查','完成紀錄']],['客訴處理 SOP',['傾聽與確認問題','記錄具體情況','說明處理方案','主管追蹤回覆']],['開閉店 SOP',['環境巡檢','備品補充','設備與門禁檢查','完成交接']]];
const KEY='also-spa-v5';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}};state={sales:[],staff:[],timeEntries:[],tasks:[],shifts:[],notes:{},complete:[],base:0,bonus:0,rate:0,deduct:0,...state};const officialLevels=[{name:'初光芳療師',rate:350},{name:'晨光芳療師',rate:400},{name:'暖光芳療師',rate:450},{name:'沐光芳療師',rate:500},{name:'蘊光芳療導師',rate:550},{name:'曜光首席芳療師',rate:600}];const oldLevelNames={'Level 1':'初光芳療師','Level 2':'晨光芳療師','Level 3':'暖光芳療師','Level 4':'沐光芳療師','Level 5':'蘊光芳療導師','Level 6':'曜光首席芳療師','基準級':'晨光芳療師','森光芳療師':'沐光芳療師','映光芳療導師':'蘊光芳療導師','怡蘊光芳療導師':'蘊光芳療導師'};state.levels=officialLevels;state.staff.forEach(x=>{x.level=oldLevelNames[x.level]||x.level;if(!officialLevels.some(l=>l.name===x.level))x.level='晨光芳療師'});let page='home',selectedCategory='全部',filterText='',editing=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW');const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('無法寫入本機儲存空間，請改用 Safari 網址開啟。')}};const go=p=>{page=p;editing=null;render();window.scrollTo(0,0)};const btn=(name,p)=>`<button class="tile" onclick="go('${p}')"><span>✧</span><b>${name}</b><small class="muted">開啟功能 →</small></button>`;const navs=[['首頁','home','⌂'],['業績','sales','＄'],['學習','learn','◇'],['SOP','sop','☷'],['我的','more','☰']];function nav(){ $('nav').innerHTML=navs.map(([n,p,i])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><div style="font-size:20px">${i}</div>${n}</button>`).join('')};function shell(title,body){$('app').innerHTML=`<header class="hero"><div class="eyebrow">BODY · MIND · SOUL</div><h1>ALSO SPA</h1><div class="muted">內部營運管理中心</div></header>${page!=='home'?'<button class="back" onclick="go(\'home\')">← 返回首頁</button>':''}<h2>${title}</h2>${body}`;nav()};function render(){if(page==='home')return shell('工作管理中心',`<div class="notice">預約及會員管理未啟用。各項資料先存為此裝置草稿，再於 Google 表單按「提交」完成共用登記。</div><div class="grid">${btn('每日業績','sales')}${btn('薪資計算','salary')}${btn('員工班表','shifts')}${btn('ALSO ACADEMY','learn')}${btn('SOP 知識庫','sop')}${btn('每日任務','tasks')}${btn('員工管理','staff')}${btn('系統設定','more')}</div>`);if(page==='sales')return sales();if(page==='salary')return salary();if(page==='catalog')return catalog();if(page==='sop')return sop();if(page==='learn')return learn();if(page==='more')return more();if(['tasks','staff','shifts'].includes(page))return simple();go('home')}
function catalog(){let cats=['全部',...new Set(CATALOG.map(x=>x.cat))];shell('正式品項價目表',`<div class="panel"><label>類別</label><select id="cat" onchange="selectedCategory=this.value;render()">${cats.map(c=>`<option ${selectedCategory===c?'selected':''}>${esc(c)}</option>`).join('')}</select><label>搜尋療程</label><input id="search" value="${esc(filterText)}" placeholder="輸入品項名稱" oninput="filterText=this.value;drawCatalog()"></div><div id="catalogItems"></div>`);drawCatalog()}
function drawCatalog(){let list=CATALOG.filter(x=>(selectedCategory==='全部'||x.cat===selectedCategory)&&x.name.includes(filterText));$('catalogItems').innerHTML=list.map(x=>`<div class="panel"><span class="chip">${esc(x.cat)}</span><h3>${esc(x.name)}</h3><div class="muted">${x.minutes?x.minutes+' 分鐘':'加購項目'}</div><div class="row"><span>原價 ${fmt(x.original)}</span><span class="price">會員價 ${fmt(x.member)}</span></div></div>`).join('')||'<p>沒有符合的品項</p>'}
function sales(){let sum=state.sales.reduce((a,x)=>a+x.amount,0),cats=[...new Set(CATALOG.map(x=>x.cat))];shell('每日業績',`<div class="panel"><div class="muted">累計業績草稿（此裝置）</div><div class="num">${fmt(sum)}</div><div class="row"><span class="muted">${state.sales.length} 筆紀錄</span><button class="outline" onclick="go('catalog')">查看完整價目表</button></div></div><div class="panel"><h3>新增業績</h3><label>日期</label><input id="saleDate" type="date" value="${new Date().toLocaleDateString('en-CA')}"><label>服務類別</label><select id="saleCat" onchange="drawOptions()">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><label>療程品項</label><select id="saleItem" onchange="updatePreview()"></select><label>價格類型</label><select id="priceType" onchange="updatePreview()"><option value="member">會員價</option><option value="original">原價</option><option value="custom">自訂成交價</option></select><label>單價</label><input type="number" id="unitPrice" min="0" step="1" oninput="updateSum()"><label>數量</label><input id="saleQty" type="number" min="1" step="1" value="1" oninput="updateSum()"><label>服務員工</label><select id="saleStaff"><option value="">未指定（不計薪）</option>${state.staff.map(x=>`<option>${esc(x.text)}</option>`).join('')}</select><div class="panel" style="background:#f7f3ed"><div class="muted">本筆金額</div><strong id="previewSum">—</strong></div><button class="primary" onclick="addSale()">儲存草稿並準備 Google 登記</button></div><h3>此裝置業績草稿</h3>${state.sales.slice().reverse().map(x=>`<div class="panel"><div class="row"><b>${esc(x.name)}</b><b class="price">${fmt(x.amount)}</b></div><div class="muted">${esc(x.date)} · ${esc(x.staff||'未指定')} · ${x.qty} 次 · ${esc(x.type)}</div><button class="outline danger" onclick="removeSale('${x.id}')">刪除</button></div>`).join('')||'<p class="muted">尚無紀錄</p>'}`);drawOptions()}
function drawOptions(){let c=$('saleCat').value;let items=CATALOG.filter(x=>x.cat===c);$('saleItem').innerHTML=items.map(x=>`<option value="${x.id}">${esc(x.name)}${x.minutes?' · '+x.minutes+'分鐘':''}</option>`).join('');updatePreview()};function updatePreview(){let x=CATALOG.find(i=>i.id===Number($('saleItem').value));$('unitPrice').value=$('priceType').value==='custom'?'':x?.[$('priceType').value]??0;updateSum()};function updateSum(){let a=Number($('unitPrice').value),q=Number($('saleQty').value);$('previewSum').textContent=fmt(a*q)};function addSale(){let x=CATALOG.find(i=>i.id===Number($('saleItem').value)),price=Number($('unitPrice').value),qty=Number($('saleQty').value);if(!x||!Number.isFinite(price)||price<0||!Number.isInteger(qty)||qty<1||!$('saleDate').value)return alert('請確認日期、品項、單價與數量');state.sales.push({id:String(Date.now())+Math.random(),date:$('saleDate').value,name:x.name,cat:x.cat,minutes:x.minutes||0,staff:$('saleStaff').value,level:(state.staff.find(z=>z.text===$('saleStaff').value)||{}).level||'',hourlyRate:(state.levels.find(z=>z.name===(state.staff.find(t=>t.text===$('saleStaff').value)||{}).level)||{}).rate??null,price,qty,amount:price*qty,type:$('priceType').selectedOptions[0].text});save();sales()};function removeSale(id){if(confirm('確定刪除此筆業績？')){state.sales=state.sales.filter(x=>x.id!==id);save();sales()}}
function salary(){const today=new Date().toLocaleDateString('en-CA');const staffOptions=state.staff.map(x=>`<option value="${esc(x.id)}">${esc(x.text)} · ${esc(x.level)}</option>`).join('');const rows=(state.timeEntries||[]).slice().reverse();const todayRows=rows.filter(x=>x.date===today);const mins=todayRows.reduce((a,x)=>a+x.minutes,0),pay=todayRows.reduce((a,x)=>a+x.pay,0);shell('薪資計算',`<div class="panel"><h3>今日服務時間登記</h3><p class="muted">只要選擇員工、輸入實際服務時間，系統就會依職級時薪自動計算。不需選療程或填客戶人數。</p>${state.staff.length?`<label>服務員工</label><select id="timeStaff">${staffOptions}</select><div class="grid"><div><label>服務小時</label><input id="timeHours" type="number" min="0" max="24" step="1" value="1"></div><div><label>服務分鐘</label><input id="timeMinutes" type="number" min="0" max="59" step="1" value="0"></div></div><button class="primary" onclick="addTimeEntry()">儲存草稿並準備 Google 登記</button>`:`<div class="notice">請先到員工管理新增員工並設定職級。</div><button class="outline" onclick="go('staff')">前往員工管理 →</button>`}</div><div class="panel"><div class="muted">今日服務時間草稿（此裝置）</div><div class="num">${Math.floor(mins/60)} 小時 ${mins%60} 分</div><div class="muted" style="margin-top:12px">今日薪資草稿合計（此裝置）</div><div class="num">${fmt(Math.round(pay))}</div></div><div class="panel"><h3>今日各員工草稿統計</h3>${[...new Set(todayRows.map(x=>x.staffName))].map(name=>{let list=todayRows.filter(x=>x.staffName===name),m=list.reduce((a,x)=>a+x.minutes,0),p=list.reduce((a,x)=>a+x.pay,0);return `<div class="item"><b>${esc(name)}</b><div class="row"><span>${Math.floor(m/60)} 小時 ${m%60} 分</span><b>${fmt(Math.round(p))}</b></div></div>`}).join('')||'<p class="muted">今天尚未登記服務時間。</p>'}</div><div class="panel"><h3>服務時間紀錄</h3>${rows.slice(0,50).map(x=>`<div class="item"><div class="row"><div><b>${esc(x.staffName)}</b><div class="muted">${esc(x.date)} · ${Math.floor(x.minutes/60)} 小時 ${x.minutes%60} 分 · ${esc(x.level)}（${fmt(x.rate)}/時）</div></div><b>${fmt(Math.round(x.pay))}</b></div><button class="outline danger" style="margin-top:8px" onclick="deleteTimeEntry('${esc(x.id)}')">刪除此裝置草稿</button></div>`).join('')||'<p class="muted">尚無紀錄</p>'}</div><div class="notice">薪資依實際服務分鐘數 × 登記當時職級時薪計算。每日業績獨立登記，不影響本頁計算。此處為此裝置的療程薪資草稿，不包含底薪或其他薪資項目。完成 Google 提交後的共用紀錄請至管理試算表查看。</div>`)}
function addTimeEntry(){let employee=state.staff.find(x=>x.id===$('timeStaff')?.value),h=Number($('timeHours')?.value),m=Number($('timeMinutes')?.value);if(!employee)return alert('請先選擇員工');if(!Number.isInteger(h)||!Number.isInteger(m)||h<0||h>24||m<0||m>59||h*60+m<=0)return alert('請輸入有效的服務時間');let level=state.levels.find(x=>x.name===employee.level);if(!level)return alert('找不到員工職級時薪');let minutes=h*60+m;state.timeEntries.push({id:String(Date.now())+Math.random(),date:new Date().toLocaleDateString('en-CA'),staffId:employee.id,staffName:employee.text,level:level.name,rate:level.rate,minutes,pay:minutes/60*level.rate});save();salary()}
function deleteTimeEntry(id){if(!confirm('確定刪除這筆服務時間？'))return;state.timeEntries=state.timeEntries.filter(x=>x.id!==id);save();salary()}
function addLevel(){let name=$('levelName').value.trim(),rate=Number($('levelRate').value);if(!name||!$('levelRate').value||!Number.isFinite(rate)||rate<0)return alert('請輸入等級與有效時薪');state.levels=state.levels.filter(x=>x.name!==name);state.levels.push({name,rate});save();salary()}
function removeLevel(encoded){let name=decodeURIComponent(encoded);if(state.staff.some(x=>x.level===name))return alert('有員工使用此等級，請先調整員工等級');state.levels=state.levels.filter(x=>x.name!==name);save();salary()}
function sop(){shell('SOP 知識庫',`<p class="muted">點選項目展開作業流程，內容為待審核初稿。</p><div class="panel">${SOP.map(([name,steps])=>`<details><summary>${esc(name)} <span class="badge">${steps.length} 步驟</span></summary><ol>${steps.map(s=>`<li style="margin:12px 0">${esc(s)}</li>`).join('')}</ol></details>`).join('')}</div>`)}
const lessons=['新夥伴到職須知','認識 ALSO SPA','成為 ALSO 的夥伴','服務的基本功','顧客接待與服務流程','環境與日常工作','預約與客務（教材）','品牌話術與溝通','新人必讀 SOP','公司制度與工作規範','待客禮儀 SOP','我想成為什麼樣的芳療師'];function learn(){shell('ALSO ACADEMY',`<div class="panel">學習完成 ${state.complete.length} / ${lessons.length} 單元</div>${lessons.map((x,i)=>`<details class="panel"><summary>${String(i).padStart(2,'0')}　${esc(x)} ${state.complete.includes(i)?'✓':''}</summary><p class="muted">正式教材尚待匯入。</p><label>學習心得</label><textarea id="note${i}" onchange="state.notes[${i}]=this.value;save()">${esc(state.notes[i]||'')}</textarea><button class="outline" onclick="toggleLearn(${i})">${state.complete.includes(i)?'取消完成':'標記完成'}</button></details>`).join('')}`)}function toggleLearn(i){state.complete=state.complete.includes(i)?state.complete.filter(x=>x!==i):[...state.complete,i];save();learn()}
function simple(){if(page==='staff')return staffPage();let titles={tasks:'每日任務',shifts:'員工班表'},place={tasks:'例如：檢查備品庫存',shifts:'例如：2026-10-15 小美 早班 10:00–18:00'};shell(titles[page],`<div class="panel"><label>新增紀錄</label><input id="simpleText" placeholder="${place[page]}"><button class="primary" onclick="addSimple()">新增</button></div>${state[page].map(x=>`<div class="panel row"><span>${esc(x.text)}</span><button class="outline danger" onclick="delSimple('${x.id}')">刪除</button></div>`).join('')||'<p class="muted">尚無紀錄</p>'}`)}
function staffPage(){shell('員工管理',`<div class="panel"><h3>新增員工與等級</h3><label>員工名稱</label><input id="staffName" placeholder="員工姓名或代號"><label>薪資等級</label><select id="staffLevel">${state.levels.map(x=>`<option value="${esc(x.name)}">${esc(x.name)} · ${fmt(x.rate)}/hr</option>`).join('')}</select><button class="primary" onclick="addStaff()">新增員工</button></div>${state.staff.map(x=>`<div class="panel"><div class="row"><b>${esc(x.text)}</b><button class="outline danger" onclick="delStaff('${x.id}')">刪除</button></div><label>員工等級</label><select onchange="setStaffLevel('${x.id}',this.value)">${state.levels.map(l=>`<option value="${esc(l.name)}" ${x.level===l.name?'selected':''}>${esc(l.name)} · ${fmt(l.rate)}/hr</option>`).join('')}</select></div>`).join('')}`)}
function addStaff(){let name=$('staffName').value.trim(),level=$('staffLevel').value;if(!name||state.staff.some(x=>x.text===name))return alert('請輸入未使用的員工名稱');state.staff.push({id:String(Date.now())+Math.random(),text:name,level});save();staffPage()}
function setStaffLevel(id,level){let x=state.staff.find(x=>x.id===id);if(x){x.level=level;save();staffPage()}}
function delStaff(id){if(!confirm('刪除員工？既有業績紀錄不會刪除'))return;state.staff=state.staff.filter(x=>x.id!==id);save();staffPage()}
function addSimple(){let v=$('simpleText').value.trim();if(!v)return alert('請輸入內容');state[page].push({id:String(Date.now())+Math.random(),text:v});save();simple()};function delSimple(id){state[page]=state[page].filter(x=>x.id!==id);save();simple()}
function more(){shell('我的／系統設定',`<div class="panel"><h3>ALSO SPA · Google 表單登記版</h3><p>預約系統：已關閉</p><p>會員管理：已關閉</p><p>資料儲存：此裝置草稿與 Google 共用紀錄分開保存</p><p>帳號登入：未啟用（不可作為正式權限驗證）</p><p>Google 表單：已串接；送出後進入共用計算試算表</p><button class="outline" onclick="exportData()">匯出本機紀錄 JSON</button></div><div class="notice">網站不會自動讀回其他裝置的紀錄。共用統計請至管理試算表查看；刪除此裝置草稿不會刪除 Google 紀錄。</div>`)}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='also-spa-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
window.addEventListener('error',e=>{console.error(e.error||e.message)});

const GOOGLE_FORMS = {"sales":{"url":"https://docs.google.com/forms/d/e/1FAIpQLScPeSnxyjVT7NIluG7nFYKjcAT7XT3FiSdcoUnz8qfvQw0tng/viewform","fields":{"日期":"entry.90855723","員工":"entry.254663720","品項":"entry.1124002240","價格類型":"entry.102779318","自訂單價":"entry.1176452649","數量":"entry.1354369603"}},"salary":{"url":"https://docs.google.com/forms/d/e/1FAIpQLSciuX92Xkju2Q5danjm33t79cvIp8_vqMzg-jaSNeclXPTvCw/viewform","fields":{"日期":"entry.849847015","員工":"entry.173262453","職級":"entry.714112064","服務小時":"entry.455868522","服務分鐘":"entry.1478693370"}},"staff":{"url":"https://docs.google.com/forms/d/e/1FAIpQLSdmXBkxuAN4ro1Xj0RgsSZLV0VCsn97Nku7AvdZ7nm-XcBgjw/viewform","fields":{"員工":"entry.1778237209","職級":"entry.1412935318"}},"shifts":{"url":"https://docs.google.com/forms/d/e/1FAIpQLSdo1sLWZrrHnYxqo9K_QTWa4iMZJFBIUpn8jFPg--ZvNUKnqQ/viewform","fields":{"日期":"entry.326323671","員工":"entry.411123612","班表內容":"entry.103690742"}},"tasks":{"url":"https://docs.google.com/forms/d/e/1FAIpQLSdp1BwKykZ906qkCTWoOFZgfQsXfD-KPUJjBDX-cdUE992H-A/viewform","fields":{"日期":"entry.889003526","員工":"entry.2037292609","任務內容":"entry.1176039499"}},"learn":{"url":"https://docs.google.com/forms/d/e/1FAIpQLScUFuf0gqKuamkYrXO079Sfvqu0tA5nuShcHFvwL4WnFsrSDg/viewform","fields":{"日期":"entry.691401594","員工":"entry.1736796480","單元":"entry.1017675346","心得":"entry.1436999115","完成狀態":"entry.437304559"}}};
const MANAGEMENT_SHEET='https://docs.google.com/spreadsheets/d/14EoOl4kNPZjHBxuqme7aUfuD2a6MmB3A3EyLQN0Hp_s/edit';
const cloudTitles={sales:'每日業績',salary:'服務時間與薪資',staff:'員工職級登記',shifts:'員工班表',tasks:'每日任務',learn:'學習紀錄'};
function taipeiDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function operatorName(){return localStorage.getItem('also-spa-operator')||'';}
function cloudUrl(type,values={}){let f=GOOGLE_FORMS[type];if(!f)throw Error('找不到表單');const url=new URL(f.url);url.searchParams.set('usp','pp_url');for(const[key,value]of Object.entries(values)){if(f.fields[key]&&value!==undefined&&value!==null&&value!=='')url.searchParams.set(f.fields[key],String(value));}return url.href;}
function cloudDraft(type,values){const url=cloudUrl(type,values);let panel=document.createElement('div');panel.className='panel';panel.id='cloudDraft';document.getElementById('cloudDraft')?.remove();panel.innerHTML=`<h3>確認送出 ${esc(cloudTitles[type])}</h3><p class="muted">內容已保存為此裝置草稿。請開啟 Google 表單，確認內容並按「提交」，才會進入共用紀錄。</p><a class="primary" style="display:block;text-align:center;text-decoration:none" href="${esc(url)}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">開啟已填好的 Google 表單 →</a><p class="small muted">看到 Google 顯示「我們已經收到您回覆的表單」，才代表送出成功。請勿重複提交同一筆。</p>`;$('app').appendChild(panel);panel.scrollIntoView({behavior:'smooth',block:'center'});return url;}
const localAddSale=addSale;
addSale=function(){const x=CATALOG.find(i=>i.id===Number($('saleItem').value));const qty=Number($('saleQty').value),price=Number($('unitPrice').value),date=$('saleDate').value,staff=$('saleStaff').value;const type=$('priceType').value;if(!x||!date||!$('unitPrice').value.trim()||!Number.isFinite(price)||price<0||!Number.isInteger(qty)||qty<1){alert('請確認日期、品項、單價與數量');return;}let label=type==='member'?'會員價':type==='original'?'原價':'自訂成交價';if(type!=='custom'&&price!==x[type])label='自訂成交價';const data={'日期':date,'員工':staff,'品項':String(x.id).padStart(2,'0')+'｜'+x.name+(x.minutes?'｜'+x.minutes+'分鐘':''),'價格類型':label,'自訂單價':label==='自訂成交價'?price:'','數量':qty};if(label==='自訂成交價')$('priceType').value='custom';localAddSale();cloudDraft('sales',data);};
const localAddTime=addTimeEntry;
addTimeEntry=function(){const employee=state.staff.find(x=>x.id===$('timeStaff')?.value);const h=Number($('timeHours')?.value),m=Number($('timeMinutes')?.value);if(!employee||!Number.isInteger(h)||!Number.isInteger(m)||h<0||h>24||m<0||m>59||h*60+m<=0){alert('請選擇員工並輸入有效服務時間');return;}const data={'日期':taipeiDate(),'員工':employee.text,'職級':employee.level,'服務小時':h,'服務分鐘':m};localAddTime();cloudDraft('salary',data);};
const localAddStaff=addStaff;
addStaff=function(){const name=$('staffName').value.trim(),level=$('staffLevel').value;if(!name||state.staff.some(x=>x.text===name)){alert('請輸入未使用的員工名稱');return;}localAddStaff();cloudDraft('staff',{'員工':name,'職級':level});};
const localSetStaff=setStaffLevel;
setStaffLevel=function(id,level){const person=state.staff.find(x=>x.id===id);localSetStaff(id,level);if(person)cloudDraft('staff',{'員工':person.text,'職級':level});};
const localSimple=addSimple;
addSimple=function(){const key=page,text=$('simpleText').value.trim();if(!text){alert('請輸入內容');return;}localSimple();cloudDraft(key,{'日期':taipeiDate(),'員工':operatorName(),[key==='tasks'?'任務內容':'班表內容']:text});};
const localToggleLearn=toggleLearn;
toggleLearn=function(i){const note=$('note'+i)?.value||state.notes[i]||'';state.notes[i]=note;localToggleLearn(i);cloudDraft('learn',{'日期':taipeiDate(),'員工':operatorName(),'單元':lessons[i],'心得':note,'完成狀態':state.complete.includes(i)?'已完成':'未完成'});};
function cloudHub(){shell('Google 共用紀錄',`<div class="notice">請於 Google 表單按「提交」完成登記。網站上的紀錄為此裝置草稿，其他裝置的共用紀錄請至管理試算表查看。</div><div class="grid">${Object.keys(GOOGLE_FORMS).map(k=>`<a class="tile" style="display:block;text-decoration:none" href="${esc(cloudUrl(k,{'日期':taipeiDate(),'員工':operatorName()}))}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer"><span>✧</span><b>${esc(cloudTitles[k])}</b><small class="muted">填寫 Google 表單 →</small></a>`).join('')}</div><div class="panel"><h3>管理試算表</h3><p class="muted">每日與每月業績、服務分鐘及療程薪資彙整，僅已獲授權帳號可查看。</p><a class="outline" style="display:inline-block;text-decoration:none" href="${MANAGEMENT_SHEET}" target="_blank" rel="noopener noreferrer">查看共用紀錄 →</a></div>`);}
const localRender=render;
render=function(){if(page==='cloud')return cloudHub();localRender();if(page==='home'){const grid=$('app').querySelector('.grid');if(grid)grid.insertAdjacentHTML('beforeend',btn('Google 共用紀錄','cloud'));}if(page==='more'){$('app').insertAdjacentHTML('beforeend',`<div class="panel"><h3>Google 紀錄設定</h3><label>你的員工姓名／代號</label><input id="operatorName" value="${esc(operatorName())}" placeholder="帶入班表、任務與學習紀錄"><button class="primary" onclick="localStorage.setItem('also-spa-operator',document.getElementById('operatorName').value.trim());alert('已儲存');">儲存姓名</button><button class="outline" onclick="go('cloud')">開啟 Google 共用紀錄</button></div>`);}};

<style>.status{padding:12px;border-radius:12px;background:#eee7df;margin:12px 0;font-size:13px}.num{font-size:27px}.brandbar{display:flex;justify-content:space-between;align-items:center}.preview{background:#fff3d8;padding:10px;border-radius:12px;font-size:12px;margin:12px 0}.grid .num{overflow-wrap:anywhere}input:focus,select:focus{outline:2px solid #718a76}button:disabled{opacity:.5;cursor:wait}</style>
<script>
// 設定已部署的後端 URL 才能使用正式登入。後端必須驗證 session、角色與資料所有權。
const API_BASE = ''; // 例如 https://your-backend.example.com
let currentUser=null, previewMode=false, salesScope='day', scopeValue=taipeiDate();
const adminPages=['staff','sales','more','cloud'];
async function api(path,method='GET',body){
 if(!API_BASE)throw Error('尚未串接登入與雲端後端');
 const r=await fetch(API_BASE+path,{method,credentials:'include',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
 const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.message||'連線失敗，請重試');return data;
}
function isAdmin(){return currentUser?.role==='admin'}
function entryDate(){return taipeiDate()}
function loginPage(){page='login';$('nav').innerHTML='';$('app').innerHTML=`<header class="hero"><div class="eyebrow">BODY · MIND · SOUL</div><h1>ALSO SPA</h1><p class="muted">2.1 內部管理中心</p></header><div class="panel"><h2>夥伴登入</h2><label>帳號</label><input id="loginAccount" autocomplete="username"><label>密碼</label><input id="loginPassword" type="password" autocomplete="current-password"><button class="primary" onclick="signIn()">登入</button><div id="loginStatus" role="status" class="status">${API_BASE?'請使用個人帳號登入':'正式登入與雲端尚未串接，目前可查看操作預覽。'}</div></div><div class="panel"><h3>操作預覽</h3><p class="muted">使用此裝置的測試資料，不代表正式登入或雲端保存。</p><div class="toolbar"><button class="outline" onclick="startPreview('staff')">芳療師預覽</button><button class="outline" onclick="startPreview('admin')">管理者預覽</button></div></div>`}
async function signIn(){try{$('loginStatus').textContent='登入中…';const result=await api('/auth/login','POST',{account:$('loginAccount').value,password:$('loginPassword').value});currentUser=result.user;previewMode=false;state=result.state||state;go('home')}catch(e){$('loginStatus').textContent=e.message}}
function startPreview(role){previewMode=true;const person=state.staff[0]||{id:'preview-staff',text:'示範芳療師',level:'沐光芳療師'};currentUser={id:person.id,name:person.text,role,level:person.level,rate:officialLevels.find(x=>x.name===person.level)?.rate||500};go('home')}
async function logout(){if(!previewMode)try{await api('/auth/logout','POST')}catch(e){alert(e.message);return}currentUser=null;previewMode=false;loginPage()}
const v21Shell=shell;
shell=function(title,body){v21Shell(title,body);$('app').querySelector('.hero').insertAdjacentHTML('beforeend',`<div class="brandbar"><small>${esc(currentUser?.name||'')} · ${isAdmin()?'管理者':'芳療師'}</small><button class="outline" onclick="logout()">登出</button></div>${previewMode?'<div class="preview">操作預覽 · 資料僅儲存在此裝置，雲端尚未連線</div>':''}`)};
nav=function(){const list=isAdmin()?[['首頁','home'],['業績','sales'],['時數薪資','salary'],['排班','shifts'],['管理','more']]:[['首頁','home'],['我的薪資','salary'],['我的排班','shifts'],['學習','learn'],['SOP','sop']];$('nav').innerHTML=list.map(([name,p])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${name}</button>`).join('')};
const v21Render=render;
render=function(){if(!currentUser)return loginPage();if(!isAdmin()&&adminPages.includes(page)){page='home'}if(page==='home')return shell(isAdmin()?'管理者首頁':'芳療師首頁',`<div class="grid">${(isAdmin()?[['每日業績總覽','sales'],['全體時數與薪資','salary'],['員工與職級管理','staff'],['排班管理','shifts'],['培訓與升等審核','learn'],['SOP 與系統設定','more']]:[['今日服務時間','salary'],['我的療程薪資','salary'],['我的排班','shifts'],['ALSO ACADEMY','learn'],['SOP 知識庫','sop'],['今日任務','tasks']]).map(([n,p])=>btn(n,p)).join('')}</div>`);v21Render()};
function myEntries(){return state.timeEntries.filter(x=>isAdmin()||x.staffId===currentUser.id)}
function salary(){let rows=myEntries(),today=rows.filter(x=>x.date===entryDate()),minutes=today.reduce((a,x)=>a+x.minutes,0),pay=today.reduce((a,x)=>a+x.pay,0);shell(isAdmin()?'全體時數與薪資':'我的今日療程薪資',`<div class="panel"><h3>今日服務時間</h3>${isAdmin()?`<label>芳療師</label><select id="timeStaff" onchange="salaryPreview()">${[...state.staff,...(state.staff.length?[]:[{id:currentUser.id,text:currentUser.name,level:currentUser.level}])].map(x=>`<option value="${esc(x.id)}">${esc(x.text)} · ${esc(x.level)}</option>`).join('')}</select>`:`<p>${esc(currentUser.name)} · ${esc(currentUser.level)} · ${fmt(currentUser.rate)}／小時</p>`}<div class="grid"><div><label>今天服務小時</label><input id="timeHours" type="number" min="0" max="24" step="1" value="0" oninput="salaryPreview()"></div><div><label>額外分鐘</label><input id="timeMinutes" type="number" min="0" max="59" step="1" value="0" oninput="salaryPreview()"></div></div><hr style="border:0;border-top:1px solid #eee;margin:24px 0"><div class="grid"><div><p class="muted">本次登記服務時數</p><div class="num" id="timePreview">0 小時 0 分</div></div><div><p class="muted">本次應計療程薪資</p><div class="num" id="payPreview">NT$ 0</div></div></div><p class="status">職級與時薪由管理者設定，員工不可自行修改。</p><button id="paySave" class="primary" onclick="savePayroll()">${previewMode?'儲存此裝置預覽紀錄':'確認並儲存'}</button><div id="payStatus" role="status"></div></div><div class="panel"><p class="muted">今日已登記合計</p><div class="num">${Math.floor(minutes/60)} 小時 ${minutes%60} 分 · ${fmt(Math.round(pay))}</div></div><h3>${isAdmin()?'全體服務紀錄':'我的服務紀錄'}</h3>${rows.slice().reverse().map(x=>`<div class="panel"><b>${esc(x.staffName)}</b><p class="muted">${esc(x.date)} · ${esc(x.level)}</p><div class="row"><span>${Math.floor(x.minutes/60)} 小時 ${x.minutes%60} 分</span><b>${fmt(Math.round(x.pay))}</b></div></div>`).join('')||'<p class="muted">尚無紀錄</p>'}`);salaryPreview()}
function payrollPerson(){if(!isAdmin())return {id:currentUser.id,text:currentUser.name,level:currentUser.level,rate:currentUser.rate};let p=state.staff.find(x=>x.id===$('timeStaff')?.value)||{id:currentUser.id,text:currentUser.name,level:currentUser.level};return {...p,rate:officialLevels.find(x=>x.name===p.level)?.rate||0}}
function readMinutes(){const h=Number($('timeHours').value),m=Number($('timeMinutes').value);if(!Number.isInteger(h)||!Number.isInteger(m)||h<0||m<0||m>59||h*60+m>1440)return null;return h*60+m}
function salaryPreview(){const mins=readMinutes(),person=payrollPerson();$('timePreview').textContent=mins===null?'請確認時間':`${Math.floor(mins/60)} 小時 ${mins%60} 分`;$('payPreview').textContent=mins===null?'—':fmt(Math.round(mins/60*person.rate))}
let payrollBusy=false,pendingPayroll=null;
async function savePayroll(){if(payrollBusy)return;const minutes=readMinutes();if(!minutes){$('payStatus').textContent='請輸入大於零且不超過24小時的有效服務時間';return}const person=payrollPerson(),signature=[person.id,entryDate(),minutes].join('|');if(!pendingPayroll||pendingPayroll.signature!==signature)pendingPayroll={signature,id:crypto.randomUUID()};payrollBusy=true;$('paySave').disabled=true;$('payStatus').textContent='儲存中…';try{if(previewMode){if(!state.timeEntries.some(x=>x.id===pendingPayroll.id)){state.timeEntries.push({id:pendingPayroll.id,date:entryDate(),staffId:person.id,staffName:person.text,level:person.level,rate:person.rate,minutes,pay:minutes/60*person.rate});localStorage.setItem(KEY,JSON.stringify(state))}salary();$('payStatus').textContent='已儲存此裝置預覽紀錄；尚未存入雲端。'}else{const result=await api('/payroll','POST',{requestId:pendingPayroll.id,staffId:person.id,date:entryDate(),minutes});if(!result.entry?.id)throw Error('後端未確認儲存成功');state.timeEntries=state.timeEntries.filter(x=>x.id!==result.entry.id);state.timeEntries.push(result.entry);salary();$('payStatus').textContent='雲端儲存成功'}pendingPayroll=null}catch(e){$('payStatus').textContent='儲存失敗：'+e.message+'，輸入內容已保留。'}finally{payrollBusy=false;if($('paySave'))$('paySave').disabled=false}}
const oldSales=sales;
sales=function(){oldSales();const rows=state.sales.filter(x=>salesScope==='month'?x.date?.slice(0,7)===scopeValue.slice(0,7):x.date===scopeValue);const panel=$('app').querySelector('.panel');panel.innerHTML=`<label>統計範圍</label><select onchange="salesScope=this.value;scopeValue=entryDate();sales()"><option value="day" ${salesScope==='day'?'selected':''}>當日業績</option><option value="month" ${salesScope==='month'?'selected':''}>月份業績</option></select><label>${salesScope==='day'?'日期':'月份'}</label><input type="${salesScope==='day'?'date':'month'}" value="${salesScope==='day'?scopeValue:scopeValue.slice(0,7)}" onchange="scopeValue=this.value;sales()"><p class="muted">${salesScope==='day'?'當日':'當月'}業績${previewMode?'（此裝置預覽）':''}</p><div class="num">${fmt(rows.reduce((a,x)=>a+x.amount,0))}</div><p class="muted">${rows.length} 筆紀錄</p>`;const headings=[...$('app').querySelectorAll('h3')];const heading=headings.find(x=>x.textContent==='此裝置業績草稿');if(heading){heading.textContent='所選期間業績紀錄';let next=heading.nextElementSibling;while(next){let following=next.nextElementSibling;next.remove();next=following}heading.insertAdjacentHTML('afterend',rows.slice().reverse().map(x=>`<div class="panel"><b>${esc(x.name)}</b><p>${esc(x.date)} · ${esc(x.staff||'未指定')}</p><b>${fmt(x.amount)}</b></div>`).join('')||'<p class="muted">此期間尚無紀錄</p>')}};
const legacySimple=simple;
simple=function(){if(isAdmin())return legacySimple();const title=page==='shifts'?'我的排班':'今日任務';const rows=state[page].filter(x=>x.staffId===currentUser.id||x.staffName===currentUser.name);shell(title,rows.map(x=>`<div class="panel">${esc(x.text)}</div>`).join('')||'<div class="panel muted">尚無指派紀錄，請由管理者安排。</div>')};
more=function(){shell('SOP 與系統設定',`<div class="panel"><p>ALSO SPA 2.1</p><p>目前模式：${previewMode?'此裝置操作預覽':'正式登入'}</p><p>雲端後端：${API_BASE?'已設定，儲存時確認回傳結果':'尚未串接'}</p><button class="outline" onclick="go('sop')">SOP 知識庫</button> <button class="outline" onclick="exportData()">匯出此裝置紀錄</button></div>`)};
cloudDraft=function(){const box=document.createElement('div');box.className='status';box.textContent=previewMode?'已儲存此裝置預覽紀錄；尚未存入雲端。':'此項目尚待串接正式後端。';$('app').appendChild(box)};
loginPage();
</script>
